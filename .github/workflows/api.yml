# CI de l'API : format, lint (go vet), migrations sur un vrai PostgreSQL, tests.
# Scalingo attend que ce workflow soit vert avant de déployer automatiquement.
name: API CI

on:
  push:
    branches: [main]
    paths: ["api/**", "go.mod", "go.sum", ".github/workflows/api.yml"]
  pull_request:
    paths: ["api/**", "go.mod", "go.sum", ".github/workflows/api.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forum
          POSTGRES_PASSWORD: forum
          POSTGRES_DB: forum_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://forum:forum@localhost:5432/forum_test?sslmode=disable
      JWT_SECRET: cle-de-test-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format (gofmt)
        run: test -z "$(gofmt -l api)"
      - name: Lint (go vet)
        run: go vet ./api/...
      - name: Migrations
        run: go run ./api migrate
      - name: Données de démo
        run: go run ./api seed
      - name: Tests
        run: go test ./api/...
